# /infra/nginx/nginx.conf
# Nginx reverse proxy for Breakprout
# Handles the custom breakprout.local domain
# Routes:
#   /      → React frontend (Vite dev server or built assets)
#   /api/  → FastAPI backend (strips the /api prefix)

# ─── Upstream definitions ─────────────────────────────────────────────────────
upstream frontend {
    server frontend:5173;           # Vite dev server inside Docker network
}

upstream backend {
    server server:8000;             # FastAPI Uvicorn server
}

# ─── Server block ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name breakprout.local localhost;

    # Increase buffer sizes for large API responses
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # Default proxy headers (applied to all locations)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ── /api/* → FastAPI (strip /api prefix) ────────────────────────────────
    location /api/ {
        proxy_pass http://backend/;   # trailing slash strips /api prefix

        # Timeouts suitable for long-running API calls
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;

        # CORS preflight support (remove if FastAPI handles CORS itself)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # ── WebSocket upgrade for Vite HMR ──────────────────────────────────────
    location /vite-hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ── / → React frontend (Vite dev server) ────────────────────────────────
    location / {
        proxy_pass http://frontend;

        # Required for Vite HMR (WebSocket upgrade)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Don't cache during development
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;   # keep alive for HMR socket
    }

    # ── Static asset caching (production only) ───────────────────────────────
    # Uncomment this block when switching to the production build:
    #
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    #     root /usr/share/nginx/html;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    #     try_files $uri =404;
    # }
    #
    # location / { 
    #     root /usr/share/nginx/html;
    #     try_files $uri $uri/ /index.html;
    # }

    # ── Error pages ──────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"error":"Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}
