services:
  db:
    image: postgres:18.4-alpine
    container_name: breakprout_db
    restart: always
    environment:
      POSTGRES_DB: breakprout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d breakprout"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - breakprout_net

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: breakprout_server
    restart: always
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/breakprout
      - SECRET_KEY=supersecretkeyforlocaldevelopmentbreakproutgameserver
      - ACCESS_TOKEN_EXPIRE_MINUTES=11520
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../server:/app
      - server_venv:/app/.venv
    networks:
      - breakprout_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - breakprout_net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: on-failure           # retry when frontend DNS isn't ready yet
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_started
      server:
        condition: service_started
    networks:
      - breakprout_net

volumes:
  postgres_data:
    driver: local
  server_venv:
    driver: local

networks:
  breakprout_net:
    driver: bridge
