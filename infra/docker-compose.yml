services:
  db:
    image: postgres:18.4-alpine
    container_name: breakprout_db
    restart: always
    environment:
      POSTGRES_DB: breakprout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d breakprout"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: breakprout_server
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/breakprout
      - SECRET_KEY=supersecretkeyforlocaldevelopmentbreakproutgameserver
      - ACCESS_TOKEN_EXPIRE_MINUTES=11520
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
